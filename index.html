<script>
    let carrito = [];

    function agregarAlCarrito(nombre, precio) {
        const index = carrito.findIndex(item => item.nombre === nombre);
        if (index !== -1) {
            carrito[index].cantidad += 1;
        } else {
            carrito.push({ nombre, precio, cantidad: 1 });
        }
        actualizarCarrito();
        mostrarNotificacion();
    }

    function cambiarCantidad(index, cambio) {
        carrito[index].cantidad += cambio;
        if (carrito[index].cantidad <= 0) {
            carrito.splice(index, 1);
        }
        actualizarCarrito();
    }

    function actualizarCarrito() {
        const cartList = document.getElementById('cart-items-list');
        const cartCount = document.getElementById('cart-count');
        const totalModal = document.getElementById('total-modal');
        const barTotal = document.getElementById('bar-total');

        if (!cartList) return;

        cartList.innerHTML = '';
        let total = 0;
        let cantidadTotal = 0;

        if (carrito.length === 0) {
            cartList.innerHTML = '<p style="text-align:center; color:#64748b; margin-top:20px;">Tu carrito está vacío</p>';
        } else {
            carrito.forEach((item, index) => {
                total += item.precio * item.cantidad;
                cantidadTotal += item.cantidad;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <div class="cart-item-details">
                        <span class="cart-item-title">${item.nombre}</span>
                        <span class="cart-item-price">$${item.precio.toLocaleString('es-CO')} x ${item.cantidad}</span>
                    </div>
                    <div class="cart-item-actions">
                        <button class="qty-btn" onclick="cambiarCantidad(${index}, -1)">-</button>
                        <span>${item.cantidad}</span>
                        <button class="qty-btn" onclick="cambiarCantidad(${index}, 1)">+</button>
                    </div>
                `;
                cartList.appendChild(itemDiv);
            });
        }

        cartCount.textContent = cantidadTotal;
        barTotal.textContent = `$${total.toLocaleString('es-CO')}`;
        totalModal.textContent = `$${total.toLocaleString('es-CO')}`;
    }

    function abrirCarrito() {
        document.getElementById('cartModal').style.display = 'flex';
    }

    function cerrarCarrito() {
        document.getElementById('cartModal').style.display = 'none';
    }

    function cerrarFueraModal(e) {
        if (e.target.id === 'cartModal') {
            cerrarCarrito();
        }
    }

    function mostrarNotificacion() {
        const notif = document.getElementById('notif');
        notif.classList.add('show');
        setTimeout(() => {
            notif.classList.remove('show');
        }, 2000);
    }

    function finalizarPedido() {
        if (carrito.length === 0) {
            alert('El carrito está vacío.');
            return;
        }

        let mensaje = "¡Hola! Quisiera realizar el siguiente pedido:%0A%0A";
        let total = 0;

        carrito.forEach(item => {
            const subtotal = item.precio * item.cantidad;
            total += subtotal;
            mensaje += `• ${item.nombre} (x${item.cantidad}) - $${subtotal.toLocaleString('es-CO')}%0A`;
        });

        mensaje += `%0A*Total:* $${total.toLocaleString('es-CO')}`;
        
        // Reemplaza este número por tu número de WhatsApp con código de país (ej. 573001234567)
        const numeroTelefono = "573000000000";
        window.open(`https://wa.me/${numeroTelefono}?text=${mensaje}`, '_blank');
    }
</script>
