<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aralú Beauty - Tienda Oficial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #faf5f8;
            color: #333;
            padding-bottom: 80px;
        }
        header {
            background: linear-gradient(135deg, #d4a373, #faedcd);
            color: #4a3b32;
            text-align: center;
            padding: 30px 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        header h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
        }
        header p {
            font-size: 1rem;
            font-style: italic;
            opacity: 0.9;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .product-card {
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            text-align: center;
            padding: 20px;
        }
        .product-image {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
            background-color: #f0f0f0;
        }
        .product-title {
            font-size: 1.4rem;
            color: #2b2b2b;
            margin-bottom: 8px;
        }
        .product-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #d4a373;
            margin-bottom: 15px;
        }
        .btn-add {
            background-color: #d4a373;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }
        .btn-add:hover {
            background-color: #bc8a5f;
        }
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            padding: 15px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Aralú Beauty</h1>
        <p>Belleza que te hace brillar ✨</p>
    </header>

    <div class="container">
        <div class="product-card">
            <div class="product-image" style="display:flex;align-items:center;justify-content:center;font-size:4rem;">🧴</div>
            <h2 class="product-title">Shampoo Milagros</h2>
            <p class="product-price">$39.900 COP</p>
            <button class="btn-add" onclick="agregarAlCarrito('Shampoo Milagros', 39900)">Agregar al Carrito 🛒</button>
        </div>
    </div>

    <div class="cart-bar">
        <div>
            <strong>Total:</strong> <span id="total-price">$0 COP</span>
        </div>
        <button class="btn-whatsapp" onclick="enviarWhatsApp()">
            Finalizar Pedido por WhatsApp 📲
        </button>
    </div>

    <script>
        let carrito = [];
        let total = 0;

        function agregarAlCarrito(nombre, precio) {
            carrito.push({ nombre, precio });
            total += precio;
            actualizarCarrito();
        }

        function actualizarCarrito() {
            document.getElementById('total-price').innerText = '$' + total.toLocaleString('es-CO') + ' COP';
        }

        function enviarWhatsApp() {
            if (carrito.length === 0) {
                alert('Por favor agrega al menos un producto al carrito.');
                return;
            }

            let mensaje = "¡Hola Aralú Beauty! ✨ Quiero realizar el siguiente pedido:\n\n";
            carrito.forEach((prod, index) => {
                mensaje += `${index + 1}. ${prod.nombre} - $${prod.precio.toLocaleString('es-CO')}\n`;
            });
            mensaje += `\n*Total:* $${total.toLocaleString('es-CO')} COP\n\n¿Me ayudan con los datos para el envío?`;

            let telefono = "573507077889";
            let url = `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
